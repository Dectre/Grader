<!DOCTYPE html>
<html lang="fa" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Assignment Grading System</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <style>
        @font-face { font-family: 'Vazirmatn'; src: url('/fonts/Vazirmatn.ttf'); }
        @font-face { font-family: 'Inter'; src: url('/fonts/Inter-Regular.ttf'); }

        :root[data-theme="dark"] {
            --bg-main: #0d1117; --bg-panel: #161b22; --bg-top: #010409;
            --text-main: #e6edf3; --border: #30363d; --btn-bg: #21262d;
            --btn-hover: #30363d; --blue: #58a6ff; --red: #ff7b72;
            --green: #3fb950; --yellow: #dbab09; --input-bg: #0d1117;
        }
        :root[data-theme="light"] {
            --bg-main: #f6f8fa; --bg-panel: #ffffff; --bg-top: #eaeef2;
            --text-main: #1f2328; --border: #d0d7de; --btn-bg: #f6f8fa;
            --btn-hover: #eaeef2; --blue: #0969da; --red: #d73a49;
            --green: #28a745; --yellow: #b08800; --input-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Vazirmatn', 'Inter', sans-serif;
            background-color: var(--bg-main); color: var(--text-main);
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        .text-red { color: var(--red); } .text-yellow { color: var(--yellow); }
        .text-green { color: var(--green); } .text-blue { color: var(--blue); }

        .top-bar {
            background-color: var(--bg-top); height: 55px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 10px; border-bottom: 1px solid var(--border); flex-shrink: 0;
        }

        .btn {
            background-color: var(--btn-bg); color: var(--text-main);
            border: 1px solid var(--border); border-radius: 6px;
            padding: 6px 12px; cursor: pointer; font-weight: bold;
            font-family: inherit; font-size: 13px; transition: 0.2s;
            display: flex; align-items: center; gap: 5px;
        }
        .btn:hover { background-color: var(--btn-hover); }
        .btn-icon { width: 35px; height: 35px; justify-content: center; padding: 0; font-size: 16px; }
        .btn-submit { background-color: #1f6feb; color: white; border: none; }
        .btn-submit:hover { background-color: #388bfd; }
        .btn-submit.saved { background-color: #238636; }
        .btn-clear { background-color: var(--btn-bg); color: var(--red); }
        .btn-clear:hover { background-color: #b62324; color: white; border: none; }

        .expand-fab {
            position: fixed; top: 6px; right: 6px; z-index: 200;
            width: 28px; height: 28px;
            background: var(--bg-panel); color: var(--text-main);
            border: 1px solid var(--border); border-radius: 6px;
            cursor: pointer; font-size: 12px;
            display: none; align-items: center; justify-content: center;
        }
        .expand-fab.show { display: flex; }
        .expand-fab:hover { background: var(--btn-hover); }

        .search-container { position: relative; display: none; margin-left: 10px; }
        .search-container.active { display: block; }
        .search-input {
            background-color: var(--bg-panel); border: 1px solid var(--border);
            border-radius: 6px; padding: 8px; color: var(--text-main);
            width: 250px; font-family: inherit;
        }
        .search-results {
            position: absolute; top: 40px; left: 0; width: 100%;
            background: var(--bg-panel); border: 1px solid var(--border);
            border-radius: 6px; max-height: 200px; overflow-y: auto;
            z-index: 1000; display: none;
        }
        .search-item { padding: 8px; cursor: pointer; border-bottom: 1px solid var(--border); text-align: right; direction: rtl; }
        .search-item:hover { background-color: #1f6feb; color: white; }

        .side-handle {
            position: fixed; top: 50%; transform: translateY(-50%);
            left: 330px; z-index: 150;
            width: 16px; height: 64px;
            background: var(--bg-panel); color: var(--text-main);
            border: 1px solid var(--border); border-left: none;
            border-radius: 0 6px 6px 0; cursor: pointer;
            font-size: 10px; display: flex; align-items: center; justify-content: center;
            transition: left .2s; padding: 0;
        }
        .side-handle:hover { background: var(--btn-hover); }

        .main-container { display: flex; flex: 1; overflow: hidden; }

        .sidebar {
            width: 330px; min-width: 330px; background-color: var(--bg-main);
            border-right: 2px solid var(--border); display: flex; flex-direction: column;
            padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
            gap: 10px; height: 100%; overflow: hidden;
        }
        .sidebar.hidden { display: none; }

        .student-select {
            width: 100%; background-color: var(--bg-panel); border: 1px solid var(--border);
            color: var(--text-main); padding: 10px; border-radius: 6px;
            font-family: inherit; direction: rtl; flex-shrink: 0;
        }
        .info-box { background-color: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
        .info-box .name { direction: rtl; text-align: right; font-weight: bold; font-size: 15px; }
        .status-row { display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; }

        .form-area {
            background-color: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px;
            padding: 10px; display: flex; flex-direction: column; gap: 10px;
            flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
        .q-row { display: flex; justify-content: space-between; align-items: center; direction: rtl; }
        .q-input {
            width: 80px; background-color: var(--input-bg); border: 1px solid var(--border);
            color: var(--text-main); padding: 6px; border-radius: 4px; text-align: center;
        }
        .q-input:focus, textarea:focus { border-color: var(--blue); outline: none; }

        .max-btn {
            background: var(--btn-bg); color: var(--green); border: 1px solid var(--border);
            border-radius: 4px; padding: 4px 8px; cursor: pointer;
            font-size: 11px; font-weight: bold; font-family: inherit;
        }
        .max-btn:hover { background: var(--btn-hover); }

        .desc-box { display: flex; flex-direction: column; gap: 5px; height: 120px; flex-shrink: 0; }
        textarea {
            width: 100%; height: 100%; background-color: var(--input-bg); border: 1px solid var(--border);
            color: var(--text-main); padding: 8px; border-radius: 6px; font-family: inherit;
            resize: none; direction: rtl;
        }

        .btn-row { display: flex; gap: 10px; flex-shrink: 0; }
        .btn-row .btn { flex: 1; justify-content: center; height: 40px; }

        .pdf-area { flex: 1; background-color: var(--bg-main); padding: 10px; overflow: hidden; display: flex; }
        .pdf-area.hidden { display: none; }
        .pdf-frame { width: 100%; height: 100%; border: 1px solid var(--border); border-radius: 8px; background-color: var(--bg-panel); }

        .stats-sidebar {
            width: 300px; min-width: 300px; background-color: var(--bg-panel);
            border-left: 2px solid var(--border); padding: 10px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            display: none; height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
        .stats-sidebar.active { display: block; }
        .stat-card { background: var(--bg-main); border: 1px solid var(--border); padding: 8px; border-radius: 6px; margin-bottom: 8px; }

        .lock-btn { background: none; border: none; color: var(--text-main); cursor: pointer; font-size: 16px; }

        .fg-badge {
            display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
            padding: 3px 11px; border-radius: 999px; font-size: 12px; font-weight: 700;
            letter-spacing: .2px; margin-top: 2px; user-select: none; white-space: nowrap;
            transition: transform .15s ease, background .2s ease, color .2s ease, box-shadow .25s ease;
        }
        .fg-badge:hover { transform: translateY(-1px); }
        .fg-badge.complete { background: rgba(63,185,80,.15); color: var(--green); box-shadow: inset 0 0 0 1px rgba(63,185,80,.45); }
        .fg-badge.incomplete { background: rgba(219,171,9,.15); color: var(--yellow); box-shadow: inset 0 0 0 1px rgba(219,171,9,.5); animation: fgPulse 1.9s ease-in-out infinite; }
        .fg-badge.nosub { background: rgba(139,148,158,.12); color: #8b949e; box-shadow: inset 0 0 0 1px rgba(139,148,158,.35); }
        @keyframes fgPulse { 0%,100% { box-shadow: inset 0 0 0 1px rgba(219,171,9,.5); } 50% { box-shadow: inset 0 0 0 3px rgba(219,171,9,.15); } }

        .btn-flag { justify-content: center; height: 32px; margin-top: 5px; font-size: 12px; transition: 0.2s; }
        .btn-flag.flagged { background-color: rgba(255,123,114,.18); color: var(--red); border-color: var(--red); }
        .btn-flag.flagged:hover { background-color: rgba(255,123,114,.30); }

        * { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
        body {
            background:
                radial-gradient(1000px 500px at 85% -10%, rgba(88,166,255,.07), transparent 60%),
                radial-gradient(800px 400px at -10% 110%, rgba(63,185,80,.05), transparent 60%),
                var(--bg-main);
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--btn-hover); }

        .btn { box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: .15s ease; }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,.3); }
        .btn:active { transform: translateY(0) scale(.98); }
        .btn-submit { background: linear-gradient(180deg, #4c9aff, #1f6feb); }
        .btn-submit:hover { background: linear-gradient(180deg, #5aa5ff, #2f7bf0); }

        .info-box, .form-area, .stat-card { box-shadow: 0 2px 10px rgba(0,0,0,.18); }
        .info-box, .form-area { background: linear-gradient(180deg, var(--bg-panel), rgba(0,0,0,.05)); }

        .q-input, textarea, .student-select, .search-input { transition: border-color .15s, box-shadow .15s; }
        .q-input:focus, textarea:focus, .search-input:focus { box-shadow: 0 0 0 3px rgba(88,166,255,.25); }

        .max-btn:hover { box-shadow: 0 0 0 3px rgba(63,185,80,.2); }
        .side-handle, .expand-fab { box-shadow: 0 2px 8px rgba(0,0,0,.3); }
    </style>
</head>
<body>

    <div class="top-bar" id="topBar">
        <div style="display:flex;gap:10px;align-items:center;">
            <button class="btn btn-icon" onclick="toggleSearch()">🔍</button>
            <div class="search-container" id="searchContainer">
                <input type="text" class="search-input" id="searchInput" placeholder="Search Name or ID..." onkeyup="handleSearch()">
                <div class="search-results" id="searchResults"></div>
            </div>
        </div>
        <div style="display:flex;gap:10px;">
            <button class="btn btn-submit" style="background-color:#238636;" onclick="window.open('/api/download/grades','_blank')">⬇️ Excel</button>
            <button class="btn btn-submit" onclick="window.open('/api/download/pdf_view','_blank')">📄 Grades PDF/View</button>
            <button class="btn" onclick="togglePDF()">👁️ Hide/Show PDF</button>
            <button class="btn" onclick="openPDFTab()">↗️ Open in New Tab</button>
            <button class="btn" onclick="toggleStats()">📊 Stats</button>
            <button class="btn" onclick="switchAssignment()">🔁 Switch</button>
            <button class="btn btn-icon" onclick="toggleTheme()" id="btnTheme">☀️</button>
            <button class="btn btn-icon" onclick="collapseTopBar()" title="Collapse top bar">▲</button>
        </div>
    </div>

    <button class="expand-fab" id="expandFab" onclick="expandTopBar()" title="Show top bar">▼</button>
    <button class="side-handle" id="sideHandle" onclick="toggleSidebar()">◀</button>

    <div class="main-container">
        <div class="sidebar" id="sidebar">
            <select class="student-select" id="studentSelect" onchange="loadStudent(this.value)"></select>
            <div class="info-box">
                <div style="color: #8b949e; font-size: 13px;" id="lblCount">Student 0/0</div>
                <div class="name" id="lblName">-</div>
                <div class="text-blue" style="font-size: 14px;" id="lblId">ID: -</div>
                <div class="status-row">
                    <span id="lblStatus" class="text-red">Status: Not Submitted Yet</span>
                    <span class="text-blue" id="lblTotal">Total: 0.00</span>
                </div>
                <div id="fgBadge" class="fg-badge nosub">— Not Submitted</div>
                <label style="display: flex; gap: 8px; align-items: center; font-weight: bold; cursor: pointer; margin-top: 5px;">
                    <input type="checkbox" id="cbNotSubmitted" onchange="inputChanged()"> Did Not Submit
                </label>
                <button class="btn btn-flag" id="btnFlag" onclick="toggleFlag()">🏳️ Flag for Review</button>
            </div>
            <button class="btn text-yellow" style="justify-content: center; height: 35px; flex-shrink: 0;" id="btnLockAll" onclick="toggleLockAll()">🔒 Lock All</button>
            <div class="form-area" id="formArea"></div>
            <div class="desc-box">
                <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 14px;">
                    <span>Description:</span>
                    <button class="lock-btn" id="btnLockDesc" onclick="toggleDescLock()">🔓</button>
                </div>
                <textarea id="txtComments" oninput="inputChanged()"></textarea>
            </div>
            <div class="btn-row" style="margin-top: auto;">
                <button class="btn btn-clear" onclick="clearInputs()">Clear</button>
                <button class="btn btn-submit" id="btnSubmit" onclick="submitGrade()">Submit</button>
            </div>
            <div class="btn-row">
                <button class="btn" onclick="goPrev()">Previous</button>
                <button class="btn" onclick="goNext()">Next</button>
            </div>
        </div>

        <div class="pdf-area" id="pdfArea">
            <embed id="pdfViewer" class="pdf-frame" type="application/pdf" style="display: none;">
            <div id="noPdfOverlay" style="display: none; width: 100%; height: 100%; background-color: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; flex-direction: column; align-items: center; justify-content: center; gap: 15px; color: var(--text-main);">
                <h2 id="noPdfText">No file uploaded for this student.</h2>
                <button id="btnUploadPdf" class="btn btn-submit" style="font-size: 15px; padding: 10px 20px; height: auto;" onclick="document.getElementById('pdfUploadInput').click()">Browse & Upload PDF</button>
            </div>
            <input type="file" id="pdfUploadInput" accept="application/pdf" style="display: none;" onchange="uploadPDF(event)">
        </div>

        <div class="stats-sidebar" id="statsSidebar">
            <h3 style="margin-bottom: 10px;">📈 Live Statistics</h3>
            <div id="statsContent"></div>
        </div>
    </div>

    <script>
        const state = {
            appData: { questions: [], max_grades: [], students: [], stats: {} },
            currentIndex: 0,
            sessionEdits: {},
            lockStates: {},
            isDescLocked: false,
        };

        const el = id => document.getElementById(id);
        const setText = (id, text) => { el(id).innerText = text; };
        const setVal = (id, val) => { el(id).value = val; };
        const getVal = id => el(id).value;
        const isChecked = id => el(id).checked;
        const setChecked = (id, v) => { el(id).checked = v; };

        const currentStudent = () => state.appData.students[state.currentIndex];
        const hasSessionEdit = id => !!state.sessionEdits[id];

        function gradeIsFilled(v) {
            return v !== "" && v !== undefined && v !== null && !isNaN(parseFloat(v));
        }
        function gradesAllFilled(grades) {
            return state.appData.questions.length > 0 &&
                state.appData.questions.every(q => gradeIsFilled(grades[q]));
        }
        function isStudentFullyGraded(s) {
            if (s.not_submitted) return false;
            if (state.sessionEdits[s.id]) {
                if (state.sessionEdits[s.id].not_submitted) return false;
                return gradesAllFilled(state.sessionEdits[s.id].grades);
            }
            return !!s.fully_graded;
        }
        function payloadFullyGraded(payload) {
            if (payload.not_submitted) return false;
            return gradesAllFilled(payload.grades);
        }

        function applySavedTheme() {
            const saved = localStorage.getItem('grader-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
            const b = el('btnTheme'); if (b) b.innerText = saved === 'dark' ? '☀️' : '🌙';
        }
        function toggleTheme() {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('grader-theme', next);
            const b = el('btnTheme'); if (b) b.innerText = next === 'dark' ? '☀️' : '🌙';
        }

        function collapseTopBar() {
            el('topBar').style.display = 'none';
            el('expandFab').classList.add('show');
        }
        function expandTopBar() {
            el('topBar').style.display = 'flex';
            el('expandFab').classList.remove('show');
        }

        function updateSideHandle() {
            const hidden = el('sidebar').classList.contains('hidden');
            const h = el('sideHandle');
            h.style.left = hidden ? '0px' : '330px';
            h.innerText = hidden ? '▶' : '◀';
        }

        function updateFgBadge() {
            const badge = el('fgBadge');
            if (!badge) return;
            if (isChecked('cbNotSubmitted')) {
                badge.className = 'fg-badge nosub';
                badge.textContent = '— Marked Absent';
                return;
            }
            const allFilled = state.appData.questions.length > 0 &&
                state.appData.questions.every(q => {
                    const input = el(`q_${q}`);
                    return input && gradeIsFilled(input.value.trim());
                });
            if (allFilled) {
                badge.className = 'fg-badge complete';
                badge.textContent = '✓ Fully Graded';
            } else {
                badge.className = 'fg-badge incomplete';
                badge.textContent = '◐ Incomplete';
            }
        }

        function updateFlagButton() {
            const btn = el('btnFlag');
            if (!btn) return;
            if (currentStudent().flagged) {
                btn.classList.add('flagged');
                btn.innerText = '🚩 Flagged for Review';
            } else {
                btn.classList.remove('flagged');
                btn.innerText = '🏳️ Flag for Review';
            }
        }

        async function toggleFlag() {
            const student = currentStudent();
            const newState = !student.flagged;
            const res = await fetch(`/api/student/${student.id}/flag`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ flagged: newState })
            });
            if (res.ok) {
                student.flagged = newState;
                updateFlagButton();
                updateDropdown();
            }
        }

        async function initApp() {
            applySavedTheme();
            updateSideHandle();
            const res = await fetch('/api/init');
            state.appData = await res.json();
            state.appData.questions.forEach(q => state.lockStates[q] = false);
            buildForm();
            updateDropdown();
            renderStats();
            const firstUnsub = state.appData.students.findIndex(s => !s.is_submitted);
            state.currentIndex = firstUnsub !== -1 ? firstUnsub : 0;
            loadStudent(state.currentIndex);
        }

        function buildForm() {
            const formArea = el('formArea');
            formArea.innerHTML = '';
            state.appData.questions.forEach((q, i) => {
                const maxG = state.appData.max_grades[i];
                formArea.innerHTML += `
                    <div class="q-row">
                        <span style="font-size: 14px;">${q} (out of ${maxG}):</span>
                        <div style="display: flex; align-items: center; gap: 5px;">
                            <button class="max-btn" onclick="setMax('${q}', ${maxG})">Max</button>
                            <input type="number" step="0.25" min="0" max="${maxG}" class="q-input" id="q_${q}" oninput="clampValue(this, ${maxG}); inputChanged()">
                            <button class="lock-btn" id="lock_${q}" onclick="toggleLock('${q}')">🔓</button>
                        </div>
                    </div>
                `;
            });
        }

        function clampValue(input, maxVal) {
            if (input.value === "") return;
            let val = parseFloat(input.value);
            if (val > maxVal) input.value = maxVal;
            if (val < 0) input.value = 0;
        }

        function studentStatusText(s) {
            if (hasSessionEdit(s.id)) return isStudentFullyGraded(s) ? "✏️ Unsaved ✓" : "✏️ Unsaved";
            if (s.not_submitted) return "⛔ Absent";
            if (s.is_submitted) return isStudentFullyGraded(s) ? "✅ Complete" : "🟡 Partial";
            return "⏳ Not Submitted";
        }

        function updateDropdown() {
            const select = el('studentSelect');
            select.innerHTML = '';
            state.appData.students.forEach(s => {
                const icon = s.has_pdf ? "📄" : "❌";
                const flagIcon = s.flagged ? "🚩 " : "";
                select.innerHTML += `<option value="${s.index}">${flagIcon}${icon} | ${studentStatusText(s)} | ${s.name} ${s.surname}</option>`;
            });
            select.value = state.currentIndex;
        }

        async function fetchStudentData(student) {
            const res = await fetch(`/api/student/${student.id}`);
            return await res.json();
        }

        function renderStudentInfo(student) {
            setText('lblCount', `Student ${state.currentIndex + 1}/${state.appData.students.length}`);
            setText('lblName', `${student.name} ${student.surname}`);
            setText('lblId', `ID: ${student.id}`);
            el('studentSelect').value = state.currentIndex;
        }

        function applyGradesToForm(student, grades, desc, notSub) {
            setChecked('cbNotSubmitted', notSub);
            setVal('txtComments', desc);
            state.appData.questions.forEach(q => {
                const input = el(`q_${q}`);
                if (hasSessionEdit(student.id)) {
                    input.value = grades[q] !== undefined ? grades[q] : "";
                } else if (student.is_submitted) {
                    input.value = (grades[q] === 0) ? "0" : (grades[q] || "");
                } else {
                    input.value = "";
                }
                input.disabled = (!student.has_pdf || notSub) || state.lockStates[q];
            });
            el('txtComments').disabled = state.isDescLocked;
        }

        async function loadStudent(idx) {
            state.currentIndex = parseInt(idx);
            const student = currentStudent();
            renderStudentInfo(student);

            let grades, desc, notSub;
            if (hasSessionEdit(student.id)) {
                grades = state.sessionEdits[student.id].grades;
                desc = state.sessionEdits[student.id].comments;
                notSub = state.sessionEdits[student.id].not_submitted;
            } else {
                const data = await fetchStudentData(student);
                grades = data.grades;
                desc = data.description;
                notSub = data.not_submitted;
                student.is_submitted = data.is_submitted;
                student.fully_graded = data.fully_graded;
                student.flagged = data.flagged;
            }

            applyGradesToForm(student, grades, desc, notSub);
            updatePdfVisibility();
            updateStatusLabel();
            updateFlagButton();
        }

        function updatePdfVisibility() {
            const student = currentStudent();
            const notSub = isChecked('cbNotSubmitted');
            const pdfViewer = el('pdfViewer');
            const noPdfOverlay = el('noPdfOverlay');

            if (student.has_pdf) {
                const targetSrc = `/api/pdf/${student.id}`;
                if (pdfViewer.getAttribute('src') !== targetSrc) pdfViewer.setAttribute('src', targetSrc);
                pdfViewer.style.display = 'block';
                noPdfOverlay.style.display = 'none';
            } else {
                if (pdfViewer.getAttribute('src') !== '') pdfViewer.setAttribute('src', '');
                pdfViewer.style.display = 'none';
                noPdfOverlay.style.display = 'flex';
                setText('noPdfText', notSub ? 'Student is marked as Absent.' : 'No file uploaded for this student.');
                el('btnUploadPdf').style.display = notSub ? 'none' : 'block';
            }
        }

        async function uploadPDF(event) {
            const file = event.target.files[0];
            if (!file) return;
            const student = currentStudent();
            const formData = new FormData();
            formData.append('file', file);
            const res = await fetch(`/api/student/${student.id}/upload`, { method: 'POST', body: formData });
            if (res.ok) {
                student.has_pdf = true;
                updateDropdown();
                loadStudent(state.currentIndex);
            }
            event.target.value = '';
        }

        function readFormGrades() {
            const grades = {};
            let total = 0;
            state.appData.questions.forEach(q => {
                const raw = getVal(`q_${q}`).trim();
                const num = parseFloat(raw);
                if (raw === "" || isNaN(num)) {
                    grades[q] = "";
                } else {
                    grades[q] = num;
                    total += num;
                }
            });
            return { grades, total };
        }

        function inputChanged() {
            const student = currentStudent();
            const { grades, total } = readFormGrades();
            state.sessionEdits[student.id] = {
                grades,
                comments: getVal('txtComments'),
                not_submitted: isChecked('cbNotSubmitted'),
            };
            updateDropdown();
            updateStatusLabel(total);
            updatePdfVisibility();
        }

        function statusLabelState() {
            const hasEdit = hasSessionEdit(currentStudent().id);
            const notSub = isChecked('cbNotSubmitted');
            if (notSub) return { text: hasEdit ? "Status: Did Not Submit - Unsaved" : "Status: Did Not Submit", cls: hasEdit ? "text-yellow" : "text-red" };
            if (hasEdit) return { text: "Status: Unsaved Changes", cls: "text-yellow" };
            if (currentStudent().is_submitted) return { text: "Status: Submitted", cls: "text-green" };
            return { text: "Status: Not Submitted Yet", cls: "text-red" };
        }

        function calculateTotalFromForm() {
            let total = 0;
            state.appData.questions.forEach(q => total += parseFloat(getVal(`q_${q}`)) || 0);
            return total;
        }

        function updateStatusLabel(totalCalc = null) {
            const st = statusLabelState();
            setText('lblStatus', st.text);
            el('lblStatus').className = st.cls;

            if (totalCalc === null) totalCalc = calculateTotalFromForm();
            setText('lblTotal', `Total: ${totalCalc.toFixed(2)}`);

            const btnSubmit = el('btnSubmit');
            if (hasSessionEdit(currentStudent().id)) {
                btnSubmit.classList.add('saved');
                btnSubmit.innerText = "Submit Changes";
            } else {
                btnSubmit.classList.remove('saved');
                btnSubmit.innerText = "Submit";
            }
            updateFgBadge();
        }

        async function submitGrade() {
            const student = currentStudent();
            if (!hasSessionEdit(student.id)) inputChanged();
            const payload = state.sessionEdits[student.id];

            const res = await fetch(`/api/student/${student.id}/submit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            if (res.ok) {
                const data = await res.json();
                state.appData.stats = data.stats;
                student.is_submitted = true;
                student.not_submitted = payload.not_submitted;
                student.fully_graded = payloadFullyGraded(payload);
                delete state.sessionEdits[student.id];
                el('btnSubmit').innerText = "Saved!";
                setTimeout(() => { updateStatusLabel(); updateDropdown(); renderStats(); }, 1000);
            }
        }

        function clearInputs() {
            state.appData.questions.forEach(q => {
                if (!state.lockStates[q]) setVal(`q_${q}`, "");
            });
            if (!state.isDescLocked) setVal('txtComments', "");
            inputChanged();
        }

        function setLockUI(q, locked) {
            state.lockStates[q] = locked;
            el(`lock_${q}`).innerText = locked ? "🔒" : "🔓";
            el(`q_${q}`).disabled = locked;
        }
        function toggleLock(q) {
            setLockUI(q, !state.lockStates[q]);
            syncLockAll();
        }
        function toggleDescLock() {
            state.isDescLocked = !state.isDescLocked;
            el('btnLockDesc').innerText = state.isDescLocked ? "🔒" : "🔓";
            el('txtComments').disabled = state.isDescLocked;
            syncLockAll();
        }
        function toggleLockAll() {
            const target = !(Object.values(state.lockStates).every(v => v) && state.isDescLocked);
            state.appData.questions.forEach(q => setLockUI(q, target));
            state.isDescLocked = target;
            el('btnLockDesc').innerText = target ? "🔒" : "🔓";
            el('txtComments').disabled = target;
            syncLockAll();
        }
        function syncLockAll() {
            const allLocked = Object.values(state.lockStates).every(v => v) && state.isDescLocked;
            el('btnLockAll').innerText = allLocked ? "🔓 Unlock All" : "🔒 Lock All";
        }

        function setMax(q, maxG) {
            if (state.lockStates[q]) return;
            el(`q_${q}`).value = maxG;
            inputChanged();
        }

        function goPrev() { if (state.currentIndex > 0) loadStudent(state.currentIndex - 1); }
        function goNext() { if (state.currentIndex < state.appData.students.length - 1) loadStudent(state.currentIndex + 1); }

        function toggleSidebar() {
            el('sidebar').classList.toggle('hidden');
            updateSideHandle();
        }
        function togglePDF() { el('pdfArea').classList.toggle('hidden'); }
        function toggleStats() { el('statsSidebar').classList.toggle('active'); }

        function openPDFTab() {
            const student = currentStudent();
            if (student.has_pdf) window.open(`/api/pdf/${student.id}`, '_blank');
        }

        function toggleSearch() {
            const container = el('searchContainer');
            container.classList.toggle('active');
            if (container.classList.contains('active')) el('searchInput').focus();
        }

        function matchesQuery(s, query) {
            return s.name.toLowerCase().includes(query) ||
                s.surname.toLowerCase().includes(query) ||
                s.id.includes(query);
        }

        function handleSearch() {
            const query = getVal('searchInput').toLowerCase();
            const resultsDiv = el('searchResults');
            resultsDiv.innerHTML = '';
            if (!query) { resultsDiv.style.display = 'none'; return; }

            const filtered = state.appData.students.filter(s => matchesQuery(s, query));
            if (filtered.length === 0) { resultsDiv.style.display = 'none'; return; }

            resultsDiv.style.display = 'block';
            filtered.forEach(s => {
                const div = document.createElement('div');
                div.className = 'search-item';
                div.innerText = `${s.name} ${s.surname} - ${s.id}`;
                div.onclick = () => {
                    loadStudent(s.index);
                    setVal('searchInput', '');
                    resultsDiv.style.display = 'none';
                    el('searchContainer').classList.remove('active');
                };
                resultsDiv.appendChild(div);
            });
        }

        function renderStats() {
            const html = Object.keys(state.appData.stats.data).map(col => `
                <div class="stat-card">
                    <div class="text-blue" style="font-weight: bold; margin-bottom: 4px;">${col}</div>
                    <div style="display: flex; justify-content: space-between; font-size: 12px;">
                        <span>Avg: ${state.appData.stats.data[col].avg}</span>
                        <span>Med: ${state.appData.stats.data[col].med}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 12px;">
                        <span>Max: ${state.appData.stats.data[col].max}</span>
                        <span>Min: ${state.appData.stats.data[col].min}</span>
                    </div>
                </div>
            `).join('');
            el('statsContent').innerHTML = html;
        }

        async function switchAssignment() {
            if (!confirm("Switch assignment? Unsaved changes will be lost.")) return;
            await fetch('/api/switch', { method: 'POST' });
            location.href = '/';
        }

        window.onload = initApp;
    </script>
</body>
</html>
