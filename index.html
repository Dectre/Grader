<!DOCTYPE html>
<html lang="fa" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Assignment Grading System</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <style>
        @font-face { font-family: 'Vazirmatn'; src: url('/fonts/Vazirmatn.ttf'); }
        @font-face { font-family: 'Inter'; src: url('/fonts/Inter-Regular.ttf'); }
        
        :root[data-theme="dark"] {
            --bg-main: #0d1117;
            --bg-panel: #161b22;
            --bg-top: #010409;
            --text-main: #e6edf3;
            --border: #30363d;
            --btn-bg: #21262d;
            --btn-hover: #30363d;
            --blue: #58a6ff;
            --red: #ff7b72;
            --green: #3fb950;
            --yellow: #dbab09;
            --input-bg: #0d1117;
        }

        :root[data-theme="light"] {
            --bg-main: #f6f8fa;
            --bg-panel: #ffffff;
            --bg-top: #eaeef2;
            --text-main: #1f2328;
            --border: #d0d7de;
            --btn-bg: #f6f8fa;
            --btn-hover: #eaeef2;
            --blue: #0969da;
            --red: #d73a49;
            --green: #28a745;
            --yellow: #b08800;
            --input-bg: #ffffff;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Vazirmatn', 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        .text-red { color: var(--red); }
        .text-yellow { color: var(--yellow); }
        .text-green { color: var(--green); }
        .text-blue { color: var(--blue); }

        .top-bar {
            background-color: var(--bg-top);
            height: 55px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .btn {
            background-color: var(--btn-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            font-size: 13px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn:hover { background-color: var(--btn-hover); }
        .btn-icon { width: 35px; height: 35px; justify-content: center; padding: 0; font-size: 16px; }
        
        .btn-submit { background-color: #1f6feb; color: white; border: none; }
        .btn-submit:hover { background-color: #388bfd; }
        .btn-submit.saved { background-color: #238636; }
        
        .btn-clear { background-color: var(--btn-bg); color: var(--red); }
        .btn-clear:hover { background-color: #b62324; color: white; border: none; }

        .search-container {
            position: relative;
            display: none;
            margin-left: 10px;
        }
        .search-container.active { display: block; }
        .search-input {
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            color: var(--text-main);
            width: 250px;
            font-family: inherit;
        }
        .search-results {
            position: absolute;
            top: 40px;
            left: 0;
            width: 100%;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }
        .search-item {
            padding: 8px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            text-align: right;
            direction: rtl;
        }
        .search-item:hover { background-color: #1f6feb; color: white; }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 330px;
            min-width: 330px;
            background-color: var(--bg-main);
            border-right: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 10px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            gap: 10px;
            height: 100%;
            overflow: hidden; 
        }

        .sidebar.hidden { display: none; }

        .student-select {
            width: 100%;
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-family: inherit;
            direction: rtl;
            flex-shrink: 0;
        }

        .info-box {
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex-shrink: 0;
        }

        .info-box .name {
            direction: rtl;
            text-align: right;
            font-weight: bold;
            font-size: 15px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 14px;
        }

        .form-area {
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            min-height: 0; 
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .q-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            direction: rtl;
        }

        .q-input {
            width: 80px;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px;
            border-radius: 4px;
            text-align: center;
        }
        
        .q-input:focus, textarea:focus { border-color: var(--blue); outline: none; }

        .desc-box {
            display: flex;
            flex-direction: column;
            gap: 5px;
            height: 120px;
            flex-shrink: 0;
        }

        textarea {
            width: 100%;
            height: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px;
            border-radius: 6px;
            font-family: inherit;
            resize: none;
            direction: rtl;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn-row .btn {
            flex: 1;
            justify-content: center;
            height: 40px;
        }

        .pdf-area {
            flex: 1;
            background-color: var(--bg-main);
            padding: 10px;
            overflow: hidden;
            display: flex;
        }

        .pdf-area.hidden { display: none; }

        .pdf-frame {
            width: 100%;
            height: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: var(--bg-panel);
        }

        .stats-sidebar {
            width: 300px;
            min-width: 300px;
            background-color: var(--bg-panel);
            border-left: 2px solid var(--border);
            padding: 10px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            display: none;
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .stats-sidebar.active { display: block; }
        
        .stat-card {
            background: var(--bg-main);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .lock-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div style="display: flex; gap: 10px; align-items: center;">
            <button class="btn btn-icon" onclick="toggleSidebar()">☰</button>
            <button class="btn btn-icon" onclick="toggleSearch()">🔍</button>
            <div class="search-container" id="searchContainer">
                <input type="text" class="search-input" id="searchInput" placeholder="Search Name or ID..." onkeyup="handleSearch()">
                <div class="search-results" id="searchResults"></div>
            </div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-submit" style="background-color: #238636;" onclick="window.open('/api/download/grades', '_blank')">⬇️ Excel</button>
            <button class="btn btn-submit" onclick="window.open('/api/download/pdf_view', '_blank')">📄 Grades PDF/View</button>
            <button class="btn" onclick="togglePDF()">👁️ Hide/Show PDF</button>
            <button class="btn" onclick="openPDFTab()">↗️ Open File in New Tab</button>
            <button class="btn" onclick="toggleStats()">📊 Stats</button>
            <button class="btn btn-icon" onclick="toggleTheme()" id="btnTheme">☀️</button>
        </div>
    </div>

    <div class="main-container">
        <div class="sidebar" id="sidebar">
            <select class="student-select" id="studentSelect" onchange="loadStudent(this.value)"></select>

            <div class="info-box">
                <div style="color: #8b949e; font-size: 13px;" id="lblCount">Student 0/0</div>
                <div class="name" id="lblName">-</div>
                <div class="text-blue" style="font-size: 14px;" id="lblId">ID: -</div>
                
                <div class="status-row">
                    <span id="lblStatus" class="text-red">Status: Not Submitted Yet</span>
                    <span class="text-blue" id="lblTotal">Total: 0.00</span>
                </div>
                
                <label style="display: flex; gap: 8px; align-items: center; font-weight: bold; cursor: pointer; margin-top: 5px;">
                    <input type="checkbox" id="cbNotSubmitted" onchange="inputChanged()"> Did Not Submit
                </label>
            </div>

            <button class="btn text-yellow" style="justify-content: center; height: 35px; flex-shrink: 0;" id="btnLockAll" onclick="toggleLockAll()">🔒 Lock All</button>

            <div class="form-area" id="formArea"></div>

            <div class="desc-box">
                <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 14px;">
                    <span>Description:</span>
                    <button class="lock-btn" id="btnLockDesc" onclick="toggleDescLock()">🔓</button>
                </div>
                <textarea id="txtComments" oninput="inputChanged()"></textarea>
            </div>

            <div class="btn-row" style="margin-top: auto;">
                <button class="btn btn-clear" onclick="clearInputs()">Clear</button>
                <button class="btn btn-submit" id="btnSubmit" onclick="submitGrade()">Submit</button>
            </div>
            
            <div class="btn-row">
                <button class="btn" onclick="goPrev()">Previous</button>
                <button class="btn" onclick="goNext()">Next</button>
            </div>
        </div>

        <div class="pdf-area" id="pdfArea">
            <embed id="pdfViewer" class="pdf-frame" type="application/pdf">
        </div>

        <div class="stats-sidebar" id="statsSidebar">
            <h3 style="margin-bottom: 10px;">📈 Live Statistics</h3>
            <div id="statsContent"></div>
        </div>
    </div>

    <script>
        let appData = { questions: [], max_grades: [], students: [], stats: {} };
        let currentIndex = 0;
        let sessionEdits = {};
        let lockStates = {};
        let isDescLocked = false;

        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('btnTheme');
            if (html.getAttribute('data-theme') === 'dark') {
                html.setAttribute('data-theme', 'light');
                btn.innerText = '🌙';
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.innerText = '☀️';
            }
        }

        async function initApp() {
            const res = await fetch('/api/init');
            appData = await res.json();
            
            appData.questions.forEach(q => lockStates[q] = false);
            
            buildForm();
            updateDropdown();
            renderStats();
            
            const firstUnsub = appData.students.findIndex(s => !s.is_submitted);
            currentIndex = firstUnsub !== -1 ? firstUnsub : 0;
            loadStudent(currentIndex);
        }

        function buildForm() {
            const formArea = document.getElementById('formArea');
            formArea.innerHTML = '';
            
            appData.questions.forEach((q, i) => {
                const maxG = appData.max_grades[i];
                formArea.innerHTML += `
                    <div class="q-row">
                        <span style="font-size: 14px;">${q} (out of ${maxG}):</span>
                        <div style="display: flex; align-items: center; gap: 5px;">
                            <input type="number" step="0.25" min="0" max="${maxG}" class="q-input" id="q_${q}" oninput="inputChanged()">
                            <button class="lock-btn" id="lock_${q}" onclick="toggleLock('${q}')">🔓</button>
                        </div>
                    </div>
                `;
            });
        }

        function updateDropdown() {
            const select = document.getElementById('studentSelect');
            select.innerHTML = '';
            appData.students.forEach(s => {
                let icon = s.has_pdf ? "📄" : "❌";
                let stat = s.not_submitted ? "⛔ Absent" : (s.is_submitted ? "✅ Submitted" : "⏳ Not Submitted");
                if(sessionEdits[s.id]) stat = "✏️ Unsaved";
                
                select.innerHTML += `<option value="${s.index}">${icon} | ${stat} | ${s.name} ${s.surname}</option>`;
            });
            select.value = currentIndex;
        }

        async function loadStudent(idx) {
            currentIndex = parseInt(idx);
            const student = appData.students[currentIndex];
            
            document.getElementById('lblCount').innerText = `Student ${currentIndex + 1}/${appData.students.length}`;
            document.getElementById('lblName').innerText = `${student.name} ${student.surname}`;
            document.getElementById('lblId').innerText = `ID: ${student.id}`;
            document.getElementById('studentSelect').value = currentIndex;

            let grades = {}, desc = "", notSub = false;
            
            if (sessionEdits[student.id]) {
                grades = sessionEdits[student.id].grades;
                desc = sessionEdits[student.id].comments;
                notSub = sessionEdits[student.id].not_submitted;
            } else {
                const res = await fetch(`/api/student/${student.id}`);
                const data = await res.json();
                grades = data.grades;
                desc = data.description;
                notSub = data.not_submitted;
                student.is_submitted = data.is_submitted;
            }

            document.getElementById('cbNotSubmitted').checked = notSub;
            document.getElementById('txtComments').value = desc;

            appData.questions.forEach(q => {
                const input = document.getElementById(`q_${q}`);
                input.value = grades[q] || 0.00;
                input.disabled = (!student.has_pdf || notSub) || lockStates[q];
            });
            
            document.getElementById('txtComments').disabled = isDescLocked;

            const pdfViewer = document.getElementById('pdfViewer');
            if (student.has_pdf) {
                pdfViewer.src = `/api/pdf/${student.id}`;
                pdfViewer.style.display = 'block';
            } else {
                pdfViewer.src = '';
                pdfViewer.style.display = 'none';
            }

            updateStatusLabel();
        }

        function inputChanged() {
            const student = appData.students[currentIndex];
            let currentGrades = {};
            let total = 0;
            
            appData.questions.forEach(q => {
                const val = parseFloat(document.getElementById(`q_${q}`).value) || 0;
                currentGrades[q] = val;
                total += val;
            });

            sessionEdits[student.id] = {
                grades: currentGrades,
                comments: document.getElementById('txtComments').value,
                not_submitted: document.getElementById('cbNotSubmitted').checked
            };
            
            updateDropdown();
            updateStatusLabel(total);
        }

        function updateStatusLabel(totalCalc = null) {
            const student = appData.students[currentIndex];
            const hasEdit = !!sessionEdits[student.id];
            const notSub = document.getElementById('cbNotSubmitted').checked;
            
            const lblStatus = document.getElementById('lblStatus');
            const lblTotal = document.getElementById('lblTotal');
            
            if (notSub) {
                lblStatus.innerText = hasEdit ? "Status: Did Not Submit - Unsaved" : "Status: Did Not Submit";
                lblStatus.className = hasEdit ? "text-yellow" : "text-red";
            } else {
                if (hasEdit) {
                    lblStatus.innerText = "Status: Unsaved Changes";
                    lblStatus.className = "text-yellow";
                } else if (student.is_submitted) {
                    lblStatus.innerText = "Status: Submitted";
                    lblStatus.className = "text-green";
                } else {
                    lblStatus.innerText = "Status: Not Submitted Yet";
                    lblStatus.className = "text-red";
                }
            }
            
            if (totalCalc === null) {
                totalCalc = 0;
                appData.questions.forEach(q => totalCalc += parseFloat(document.getElementById(`q_${q}`).value) || 0);
            }
            lblTotal.innerText = `Total: ${totalCalc.toFixed(2)}`;
            
            const btnSubmit = document.getElementById('btnSubmit');
            if (hasEdit) {
                btnSubmit.classList.add('saved'); 
                btnSubmit.innerText = "Submit Changes";
            } else {
                btnSubmit.classList.remove('saved');
                btnSubmit.innerText = "Submit";
            }
        }

        async function submitGrade() {
            const student = appData.students[currentIndex];
            if (!sessionEdits[student.id]) {
                inputChanged(); 
            }
            
            const payload = sessionEdits[student.id];
            
            const res = await fetch(`/api/student/${student.id}/submit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            if (res.ok) {
                const data = await res.json();
                appData.stats = data.stats;
                delete sessionEdits[student.id];
                student.is_submitted = true;
                
                const btnSubmit = document.getElementById('btnSubmit');
                btnSubmit.innerText = "Saved!";
                setTimeout(() => { updateStatusLabel(); updateDropdown(); renderStats(); }, 1000);
            }
        }

        function clearInputs() {
            appData.questions.forEach(q => {
                if (!lockStates[q]) document.getElementById(`q_${q}`).value = 0;
            });
            if (!isDescLocked) document.getElementById('txtComments').value = "";
            inputChanged();
        }

        function toggleLock(q) {
            lockStates[q] = !lockStates[q];
            document.getElementById(`lock_${q}`).innerText = lockStates[q] ? "🔒" : "🔓";
            document.getElementById(`q_${q}`).disabled = lockStates[q];
            syncLockAll();
        }

        function toggleDescLock() {
            isDescLocked = !isDescLocked;
            document.getElementById('btnLockDesc').innerText = isDescLocked ? "🔒" : "🔓";
            document.getElementById('txtComments').disabled = isDescLocked;
            syncLockAll();
        }

        function toggleLockAll() {
            const targetState = !(Object.values(lockStates).every(v => v) && isDescLocked);
            
            appData.questions.forEach(q => {
                lockStates[q] = targetState;
                document.getElementById(`lock_${q}`).innerText = targetState ? "🔒" : "🔓";
                document.getElementById(`q_${q}`).disabled = targetState;
            });
            
            isDescLocked = targetState;
            document.getElementById('btnLockDesc').innerText = targetState ? "🔒" : "🔓";
            document.getElementById('txtComments').disabled = targetState;
            
            syncLockAll();
        }

        function syncLockAll() {
            const allLocked = Object.values(lockStates).every(v => v) && isDescLocked;
            document.getElementById('btnLockAll').innerText = allLocked ? "🔓 Unlock All" : "🔒 Lock All";
        }

        function goPrev() { if(currentIndex > 0) loadStudent(currentIndex - 1); }
        function goNext() { if(currentIndex < appData.students.length - 1) loadStudent(currentIndex + 1); }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('hidden'); }
        function togglePDF() { document.getElementById('pdfArea').classList.toggle('hidden'); }
        function toggleStats() { document.getElementById('statsSidebar').classList.toggle('active'); }
        
        function openPDFTab() {
            const student = appData.students[currentIndex];
            if(student.has_pdf) window.open(`/api/pdf/${student.id}`, '_blank');
        }

        function toggleSearch() {
            const container = document.getElementById('searchContainer');
            container.classList.toggle('active');
            if(container.classList.contains('active')) document.getElementById('searchInput').focus();
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '';
            
            if (!query) { resultsDiv.style.display = 'none'; return; }
            
            const filtered = appData.students.filter(s => 
                s.name.toLowerCase().includes(query) || 
                s.surname.toLowerCase().includes(query) || 
                s.id.includes(query)
            );
            
            if(filtered.length > 0) {
                resultsDiv.style.display = 'block';
                filtered.forEach(s => {
                    const div = document.createElement('div');
                    div.className = 'search-item';
                    div.innerText = `${s.name} ${s.surname} - ${s.id}`;
                    div.onclick = () => {
                        loadStudent(s.index);
                        document.getElementById('searchInput').value = '';
                        resultsDiv.style.display = 'none';
                        document.getElementById('searchContainer').classList.remove('active');
                    };
                    resultsDiv.appendChild(div);
                });
            } else {
                resultsDiv.style.display = 'none';
            }
        }

        function renderStats() {
            const html = Object.keys(appData.stats.data).map(col => `
                <div class="stat-card">
                    <div class="text-blue" style="font-weight: bold; margin-bottom: 4px;">${col}</div>
                    <div style="display: flex; justify-content: space-between; font-size: 12px;">
                        <span>Avg: ${appData.stats.data[col].avg}</span>
                        <span>Med: ${appData.stats.data[col].med}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 12px;">
                        <span>Max: ${appData.stats.data[col].max}</span>
                        <span>Min: ${appData.stats.data[col].min}</span>
                    </div>
                </div>
            `).join('');
            document.getElementById('statsContent').innerHTML = html;
        }

        window.onload = initApp;
    </script>
</body>
</html>
